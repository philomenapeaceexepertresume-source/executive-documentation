<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Consultation enquiry</title>
  </head>
  <body>
    <form
      name="consultation"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="consultation" /><input
        name="name"
      /><input name="email" type="email" /><select name="service">
        <option>Federal &amp; USAJOBS résumés</option>
        <option>SES &amp; executive applications</option>
        <option>Private sector résumés</option>
        <option>LinkedIn &amp; personal branding</option>
        <option>Military transitions</option>
        <option>Career coaching &amp; mentoring</option>
        <option>A combination of services</option></select
      ><textarea name="message"></textarea><input name="bot-field" />
    </form>
  </body>
</html>
